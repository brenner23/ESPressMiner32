; ESPressMiner32 - ESP32 Bitcoin Solo/Pool Miner (Stratum V1)
; Hardware: klassischer ESP32 (z.B. ESP32-D0WD-V3). Der COM-Port wird automatisch gesucht.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -Wno-unused-variable
    -Wno-volatile

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; Messprogramm fuer den SHA-Beschleuniger (nur Entwicklung)
[env:hw_probe]
extends = env:esp32dev
build_src_filter = +<sha256_sw.cpp> +<../test/hw_probe/>
lib_deps =

; Messprogramm fuer die Pipeline von Master 002 (nur Entwicklung)
[env:pipe_probe]
extends = env:esp32dev
build_src_filter = +<sha256_sw.cpp> +<../test/pipe_probe/>
lib_deps =

; Master 004: Messbetrieb - Varianten der Hash-Schleife reihum je 4 Minuten minen
[env:looptest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DHW_LOOP_TEST=5

; Test Ueberhitzungsschutz: Grenzwerte knapp um die Volllast-Temperatur (~68 C)
[env:thermaltest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DTEMP_SW_PAUSE_C=66.0f
    -DTEMP_STOP_C=68.0f
    -DTEMP_RESUME_C=63.0f
